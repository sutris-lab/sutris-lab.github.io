<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trizz Hub - Personal Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col items-center py-10">
    <div class="max-w-md w-full p-6">
        
        <!-- Header / Profil -->
        <div class="mb-8 text-center cursor-pointer group relative" onclick="toggleProfileForm()" title="Klik untuk edit profil">
            <div id="profileImageContainer" class="w-24 h-24 bg-slate-800 rounded-full mx-auto mb-4 border-2 border-yellow-500 flex items-center justify-center text-4xl font-bold text-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.3)] overflow-hidden group-hover:scale-105 transition-transform">
                <span id="profileInitial">T</span>
                <img id="profileImg" src="" alt="Profile" class="hidden w-full h-full object-cover">
            </div>
            <h1 id="profileNameDisplay" class="text-3xl font-bold mb-1 tracking-wider group-hover:text-yellow-500 transition-colors">Trizz</h1>
            <p class="text-slate-400 text-sm">Personal Web & Bookmark Hub</p>
            <p class="text-xs text-yellow-500/0 mt-2 font-semibold group-hover:text-yellow-500/100 transition-colors duration-300">
                ✏️ Klik untuk ubah profil
            </p>
        </div>

        <!-- Form Edit Profil -->
        <div id="profileForm" class="hidden bg-slate-800 p-4 rounded-lg mb-8 border border-slate-700 shadow-lg">
            <h2 class="text-sm font-semibold text-yellow-500 mb-3">Edit Profil Kamu</h2>
            <input type="text" id="inputProfileName" placeholder="Nama Panggilan" class="w-full mb-3 p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-yellow-500">
            <label class="block text-xs text-slate-400 mb-1">Ganti Foto (Maks 2MB):</label>
            <input type="file" id="inputProfileImage" accept="image/*" class="w-full mb-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-slate-900 hover:file:bg-yellow-400">
            <div class="flex gap-2">
                <button onclick="saveProfile()" class="flex-1 bg-yellow-500 text-slate-900 font-bold py-2 rounded text-xs hover:bg-yellow-400 transition-colors">Simpan</button>
                <button onclick="resetProfile()" class="flex-1 bg-red-900/80 text-red-200 font-bold py-2 rounded text-xs hover:bg-red-800 transition-colors">Reset Profil</button>
            </div>
            <button onclick="toggleProfileForm()" class="w-full mt-2 bg-slate-700 text-white font-bold py-2 rounded text-xs hover:bg-slate-600 transition-colors">Batal</button>
        </div>

        <!-- Form Tambah/Edit Link -->
        <div id="addForm" class="hidden bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700 shadow-lg">
            <h2 id="formLinkTitle" class="text-sm font-semibold text-yellow-500 mb-3">Tambah Bookmark</h2>
            <input type="hidden" id="editIndex" value="-1">
            
            <input type="text" id="linkName" placeholder="Nama Link (Cth: Sosmedku)" class="w-full mb-3 p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-yellow-500">
            <input type="url" id="linkUrl" placeholder="URL (Cth: https://...)" class="w-full mb-3 p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-yellow-500">
            
            <!-- Placeholder diubah untuk ngasih tau pengunjung -->
            <input type="text" id="linkShortcut" placeholder="Klik disini & tekan kombinasi keyboard!" class="w-full mb-4 p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-yellow-500 text-center font-mono placeholder:font-sans placeholder:text-left">
            
            <div class="flex gap-2">
                <button onclick="saveLink()" class="flex-1 bg-yellow-500 text-slate-900 font-bold py-2 rounded text-sm hover:bg-yellow-400 transition-colors">Simpan</button>
                <button onclick="toggleForm()" class="flex-1 bg-slate-700 text-white font-bold py-2 rounded text-sm hover:bg-slate-600 transition-colors">Batal</button>
            </div>
        </div>

        <!-- Daftar Semua Link -->
        <div id="linkContainer" class="flex flex-col gap-3"></div>

        <!-- Tombol Aksi Bawah -->
        <div class="mt-6 flex flex-col gap-3">
            <button onclick="openAddForm()" class="border-2 border-dashed border-slate-600 text-slate-400 hover:text-yellow-500 hover:border-yellow-500 transition-colors py-3 px-6 rounded-lg font-semibold text-center w-full">
                + Tambah Link Pribadi
            </button>
            <button onclick="resetLinksToDefault()" class="text-xs text-slate-500 hover:text-red-400 underline decoration-slate-600 transition-colors">
                Kembalikan Link ke Bawaan (Reset)
            </button>
        </div>
        
        <footer class="mt-12 text-center text-xs text-slate-500 font-mono tracking-widest">
            &copy; 2026 TRIZZ
        </footer>

    </div>

    <script>
        const defaultLinks = [
            { name: "🛠️ Referensi Koding", url: "https://github.com/sutris-lab/sutris-lab.github.io", shortcut: "" },
            { name: "▶️ Belajar bareng", url: "https://www.youtube.com/watch?v=xvFZjo5PgG0", shortcut: "" },
            { name: "⌨️ Typing Test", url: "https://monkeytype.com/", shortcut: "" },
            { name: "📺 Nonton Anime", url: "https://nontonanime.co/", shortcut: "ctrl+shift+a" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            loadLinks();
            loadProfile();
        });

        // ================= FITUR PEREKAM SHORTCUT OTOMATIS =================
        const shortcutInput = document.getElementById('linkShortcut');
        
        shortcutInput.addEventListener('keydown', function(e) {
            // Biarkan tombol Tab dan Escape berfungsi normal
            if (e.key === 'Tab' || e.key === 'Escape') return;

            e.preventDefault(); // Matikan fungsi ketik manual biasa

            // Kalau tekan Backspace atau Delete, kosongkan inputnya
            if (e.key === 'Backspace' || e.key === 'Delete') {
                this.value = '';
                return;
            }

            let keys = [];
            if (e.ctrlKey) keys.push('ctrl');
            if (e.altKey) keys.push('alt');
            if (e.shiftKey) keys.push('shift');
            
            // Kalau pengunjung baru menekan/menahan tombol modifiernya saja
            if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) {
                this.value = keys.join('+') + '+...';
                return;
            }

            // Gabungkan modifier dengan tombol utama yang ditekan
            keys.push(e.key.toLowerCase());
            this.value = keys.join('+');
        });

        // ================= FITUR TRIGGER SHORTCUT GLOBAL =================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            let keys = [];
            if (e.ctrlKey) keys.push('ctrl');
            if (e.altKey) keys.push('alt');
            if (e.shiftKey) keys.push('shift');
            
            if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;

            keys.push(e.key.toLowerCase());
            let pressedString = keys.join('+');

            let links = JSON.parse(localStorage.getItem('trizzLinks')) || [];
            let match = links.find(l => l.shortcut && l.shortcut.toLowerCase().replace(/\s+/g, '') === pressedString);
            
            if (match) {
                e.preventDefault(); 
                window.open(match.url, '_blank'); 
            }
        });

        // ================= FITUR PROFIL =================
        function toggleProfileForm() {
            const form = document.getElementById('profileForm');
            form.classList.toggle('hidden');
            if(!form.classList.contains('hidden')) {
                document.getElementById('inputProfileName').value = localStorage.getItem('trizzProfileName') || 'Trizz';
            }
        }

        function loadProfile() {
            const savedName = localStorage.getItem('trizzProfileName');
            const savedImg = localStorage.getItem('trizzProfileImg');
            const nameDisplay = document.getElementById('profileNameDisplay');
            const initialDisplay = document.getElementById('profileInitial');
            const imgDisplay = document.getElementById('profileImg');

            if (savedName) {
                nameDisplay.innerText = savedName;
                initialDisplay.innerText = savedName.charAt(0).toUpperCase();
            } else {
                nameDisplay.innerText = 'Trizz';
                initialDisplay.innerText = 'T';
            }

            if (savedImg) {
                initialDisplay.classList.add('hidden');
                imgDisplay.src = savedImg;
                imgDisplay.classList.remove('hidden');
            } else {
                imgDisplay.classList.add('hidden');
                imgDisplay.src = '';
                initialDisplay.classList.remove('hidden');
            }
        }

        function saveProfile() {
            const nameInput = document.getElementById('inputProfileName').value;
            const fileInput = document.getElementById('inputProfileImage').files[0];
            if (nameInput.trim() !== '') localStorage.setItem('trizzProfileName', nameInput.trim());
            
            if (fileInput) {
                if (fileInput.size > 2 * 1024 * 1024) { alert("Ukuran foto maksimal 2MB!"); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        localStorage.setItem('trizzProfileImg', e.target.result);
                        finishProfileSave();
                    } catch (err) { alert("Memori browser penuh."); }
                };
                reader.readAsDataURL(fileInput);
            } else {
                finishProfileSave();
            }
        }

        function finishProfileSave() {
            document.getElementById('inputProfileImage').value = ''; 
            loadProfile(); toggleProfileForm();
        }

        function resetProfile() {
            localStorage.removeItem('trizzProfileName'); localStorage.removeItem('trizzProfileImg');
            document.getElementById('inputProfileImage').value = '';
            loadProfile(); toggleProfileForm();
        }

        // ================= FITUR LINK =================
        function toggleForm() {
            document.getElementById('addForm').classList.toggle('hidden');
        }

        function openAddForm() {
            document.getElementById('formLinkTitle').innerText = "Tambah Bookmark";
            document.getElementById('editIndex').value = "-1"; 
            document.getElementById('linkName').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkShortcut').value = '';
            document.getElementById('addForm').classList.remove('hidden');
            document.getElementById('linkName').focus();
        }

        function openEditForm(index) {
            let links = JSON.parse(localStorage.getItem('trizzLinks')) || [];
            let link = links[index];
            
            document.getElementById('formLinkTitle').innerText = "Edit Bookmark";
            document.getElementById('editIndex').value = index;
            document.getElementById('linkName').value = link.name;
            document.getElementById('linkUrl').value = link.url;
            document.getElementById('linkShortcut').value = link.shortcut || '';
            document.getElementById('addForm').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function saveLink() {
            const name = document.getElementById('linkName').value;
            let url = document.getElementById('linkUrl').value;
            const shortcut = document.getElementById('linkShortcut').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!name || !url) { alert("Nama dan URL wajib diisi!"); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

            let links = JSON.parse(localStorage.getItem('trizzLinks')) || [];
            const newLinkData = { name: name, url: url, shortcut: shortcut.toLowerCase().trim() };

            if (editIndex > -1) {
                links[editIndex] = newLinkData;
            } else {
                links.push(newLinkData);
            }

            localStorage.setItem('trizzLinks', JSON.stringify(links));
            toggleForm(); loadLinks();
        }

        function loadLinks() {
            const container = document.getElementById('linkContainer');
            if (!localStorage.getItem('trizzLinks')) {
                localStorage.setItem('trizzLinks', JSON.stringify(defaultLinks));
            }
            
            let links = JSON.parse(localStorage.getItem('trizzLinks'));
            container.innerHTML = ''; 

            links.forEach((link, index) => {
                const el = document.createElement('div');
                el.className = "flex items-center gap-2 group";
                
                let shortcutBadge = link.shortcut ? `<span class="bg-slate-700 text-yellow-500 text-[10px] px-2 py-1 rounded ml-2 font-mono uppercase border border-yellow-500/30">${link.shortcut}</span>` : '';

                el.innerHTML = `
                    <a href="${link.url}" target="_blank" class="flex-1 flex justify-between items-center bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 transition-colors py-3 px-5 rounded-lg font-semibold border border-slate-700 hover:border-transparent">
                        <span>${link.name}</span>
                        ${shortcutBadge}
                    </a>
                    <button onclick="openEditForm(${index})" class="bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 text-slate-400 py-3 px-4 rounded-lg border border-slate-700 transition-colors" title="Edit">
                        ✏️
                    </button>
                    <button onclick="deleteLink(${index})" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white py-3 px-4 rounded-lg border border-red-800/50 hover:border-red-600 transition-colors" title="Hapus">
                        X
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function deleteLink(index) {
            if(confirm("Yakin mau menghapus link ini?")) {
                let links = JSON.parse(localStorage.getItem('trizzLinks'));
                links.splice(index, 1);
                localStorage.setItem('trizzLinks', JSON.stringify(links));
                loadLinks();
            }
        }

        function resetLinksToDefault() {
            if(confirm("AWAS! Ini akan menghapus SEMUA link tambahanmu dan mengembalikan 4 link asli. Yakin?")) {
                localStorage.removeItem('trizzLinks');
                loadLinks(); 
            }
        }
    </script>
</body>
</html>
